services:
  postgres:
    image: postgres:16-alpine
    container_name: techstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: techstore
      POSTGRES_PASSWORD: techstore
      POSTGRES_DB: techstore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Development mailbox: catches every email the backend sends.
  # Web UI: http://localhost:8025, SMTP: localhost:1025. Nothing reaches real inboxes.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: techstore-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
